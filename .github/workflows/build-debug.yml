name: Build Debug APK

on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Dependencies
        run: |
          npm install
      - name: Restore firebase-config.js (web config used by the WebView)
        env:
          FIREBASE_CONFIG_JS_BASE64: ${{ secrets.FIREBASE_CONFIG_JS_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG_JS_BASE64" ]; then
            echo "$FIREBASE_CONFIG_JS_BASE64" | base64 --decode > www/firebase-config.js
            echo "firebase-config.js restored from secret."
          elif [ -f www/firebase-config.js ]; then
            echo "www/firebase-config.js already present."
          else
            echo "WARNING: FIREBASE_CONFIG_JS_BASE64 secret is not set and www/firebase-config.js is missing."
            echo "         Falling back to the template — Firebase auth will NOT work in this APK."
            cp www/firebase-config.example.js www/firebase-config.js
          fi
      - name: Add & Sync Capacitor Android
        run: |
          chmod +x ./node_modules/.bin/* || true
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android
      - name: Restore google-services.json (if missing, decode from secret)
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          fi
          # Verify the file is not empty (fails gracefully with clear error)
          if [ ! -s "android/app/google-services.json" ] || [ $(wc -c < "android/app/google-services.json") -lt 100 ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 secret مفقود أو فارغ — ملف google-services.json غير صالح"
            exit 1
          fi
      - name: Add required permissions to AndroidManifest
        run: |
          for PERM in "RECORD_AUDIO" "MODIFY_AUDIO_SETTINGS" "ACCESS_NETWORK_STATE" "POST_NOTIFICATIONS"; do
            if ! grep -q "android.permission.$PERM" android/app/src/main/AndroidManifest.xml; then
              sed -i "/<application/i\\    <uses-permission android:name=\"android.permission.$PERM\" />" android/app/src/main/AndroidManifest.xml
            fi
          done
      - name: Restore Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          # Verify the keystore is not empty or corrupted (fails with clear error)
          if [ ! -s ~/.android/debug.keystore ] || [ $(wc -c < ~/.android/debug.keystore) -lt 500 ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 secret is missing or invalid — debug.keystore is too small/empty"
            exit 1
          fi
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Verify Icon Exists
        run: |
          if [ ! -f "resources/icon.png" ]; then
            echo "ERROR: resources/icon.png missing"
            exit 1
          fi
      - name: Generate Android App Icons
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#0e1015' --splashBackgroundColor '#0e1015'
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
